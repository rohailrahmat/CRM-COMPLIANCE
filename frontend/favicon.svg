<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Stylized Cannabis Leaf -->
  <g filter="url(#glow)">
    <!-- Central Leaf Blade -->
    <path d="M32 10 C32 10 38 22 34 39 C33 44 32 50 32 50 C32 50 31 44 30 39 C26 22 32 10 32 10 Z" fill="url(#leafGrad)"/>
    
    <!-- Top-Right Blade -->
    <path d="M32 32 C34 26 44 18 47 19 C48 24 43 32 37 36 C35 37 32 38 32 38 Z" fill="url(#leafGrad)"/>
    
    <!-- Top-Left Blade -->
    <path d="M32 32 C30 26 20 18 17 19 C16 24 21 32 27 36 C29 37 32 38 32 38 Z" fill="url(#leafGrad)"/>
    
    <!-- Mid-Right Blade -->
    <path d="M33 38 C37 35 48 31 51 34 C51 39 44 43 37 42 C34 42 33 41 33 41 Z" fill="url(#leafGrad)"/>
    
    <!-- Mid-Left Blade -->
    <path d="M31 38 C27 35 16 31 13 34 C13 39 20 43 27 42 C30 42 31 41 31 41 Z" fill="url(#leafGrad)"/>
    
    <!-- Bottom-Right Small Blade -->
    <path d="M33 43 C38 43 45 44 47 47 C45 49 39 49 35 47 C33 46 33 45 33 45 Z" fill="url(#leafGrad)"/>
    
    <!-- Bottom-Left Small Blade -->
    <path d="M31 43 C26 43 19 44 17 47 C19 49 25 49 29 47 C31 46 31 45 31 45 Z" fill="url(#leafGrad)"/>
    
    <!-- Stem -->
    <path d="M32 48 L32 55" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
